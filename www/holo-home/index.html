<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Holo Home</title>
<!-- Holo Home · 3D holographic dashboard for Home Assistant · MIT licence
     Don't edit this file. Describe your home in config.js (same folder). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Michroma&family=Sora:wght@300;400;600&display=swap">
<style>
/* Layout: full-bleed WebGL holodeck. HUD floats over it: status bar on top, control panel on the right
   (a bottom sheet on phones, minimised until something is picked), scene dock along the bottom. Single dark look. */
:root{
  --void:#04060d; --deck:#0b1222; --glass:rgba(12,19,38,.66);
  --line:rgba(140,220,255,.16); --line-hi:rgba(140,220,255,.42);
  --ice:#86e4ff; --ion:#b593ff; --text:#e8f2ff; --dim:#8494b4; --faint:#5b6886;
  --warm:#ffb45c; --alert:#ff5470; --ok:#62f5b5;
  --f-display:'Michroma','Eurostile','Bank Gothic',sans-serif;
  --f-body:'Sora',ui-sans-serif,system-ui,sans-serif;
  --f-data:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}#gl.hot{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 45% 40%,transparent 55%,rgba(2,3,8,.78))}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(134,228,255,.022) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:var(--r)}
small{font-family:var(--f-data);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;flex:none;max-width:260px;min-width:0}
.brand>div{min-width:0}
.brand b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.2em;font-weight:400;display:block;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:28px;height:28px;border-radius:50%;border:1px solid var(--ice);position:relative;flex:none;box-shadow:0 0 18px rgba(134,228,255,.45),inset 0 0 10px rgba(134,228,255,.35)}
.mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 12px var(--ice);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.6);opacity:.6}}
.zones{display:flex;gap:4px;padding:5px;margin-inline:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.zones::-webkit-scrollbar{display:none}
.zone{padding:9px 13px;border-radius:10px;white-space:nowrap;color:var(--dim);font-size:13px;display:flex;align-items:center;gap:8px;transition:color .2s,background .2s,box-shadow .2s}
.zone:hover{color:var(--text)}
.zone.na{opacity:.45}
.zone[aria-pressed="true"]{color:#05070d;background:var(--ice);box-shadow:0 0 22px rgba(134,228,255,.45)}
.zone i{font-style:normal;font-family:var(--f-data);font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:rgba(134,228,255,.12)}
.zone[aria-pressed="true"] i{background:rgba(5,7,13,.18)}
.status{display:flex;padding:6px;flex:none}
.stat{padding:4px 12px;border-left:1px solid var(--line);min-width:0;max-width:150px}
.stat:first-child{border-left:0}
.stat small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-family:var(--f-data);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.stat b.ok{color:var(--ok)}
.mode{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;align-items:center;gap:8px;padding:8px 12px;font-family:var(--f-data);font-size:11px;color:var(--dim)}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--warm);box-shadow:0 0 10px var(--warm)}
.mode.live i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.mode:hover{color:var(--text)}

/* control panel */
.panel{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 84px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:min(372px,calc(100vw - 32px));display:flex;flex-direction:column;overflow:hidden}
.panel.min{bottom:auto}
.panel.min .pbody{display:none}
.panel.min .phead{border-bottom:0;cursor:pointer}
.phead{display:flex;align-items:flex-end;gap:12px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.phead>div{flex:1;min-width:0}
.phead h2{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.06em;text-wrap:balance;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--f-data);font-size:11px;padding:5px 9px;border-radius:99px;border:1px solid var(--line-hi);color:var(--ice);white-space:nowrap;align-self:center}
.grip{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);flex:none;align-self:center;color:var(--dim);transform:rotate(180deg);transition:transform .3s,color .2s}
.grip:hover{color:var(--text)}
.panel.min .grip{transform:none}
.pbody{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent;flex:1}
#detail:empty{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s,background .2s,transform .15s}
.tile:hover{border-color:var(--line-hi);background:rgba(134,228,255,.05)}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--ice);box-shadow:inset 0 0 0 1px var(--ice)}
.tile.alarm{border-color:var(--alert);box-shadow:0 0 20px rgba(255,84,112,.35)}
.tile.na{opacity:.5;filter:grayscale(1)}
.tile.na .st{color:var(--faint)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--dim);transition:background .3s,color .3s,box-shadow .3s}
.tile.on .ic{background:var(--c,var(--ice));color:#05070d;box-shadow:0 0 18px var(--c,var(--ice))}
.tile .tx{display:block;min-width:0}
.tile .nm,.tile .st{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nm{font-size:13px;line-height:1.3}
.tile .st{font-family:var(--f-data);font-size:11px;color:var(--dim);margin-top:2px}
.tile.on .st{color:var(--text)}
.tile.wide{grid-column:1/-1}
.zt .row{justify-content:space-between;width:100%}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.08)}

/* device detail */
.detail{border-radius:14px;padding:16px;background:linear-gradient(160deg,rgba(134,228,255,.08),rgba(181,147,255,.05) 60%,rgba(0,0,0,0));border:1px solid var(--line-hi);display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead .t{min-width:0;flex:1}
.dhead h3{margin:3px 0 2px;font-size:16px;font-weight:600;text-wrap:balance}
.dhead code{font-family:var(--f-data);font-size:10.5px;color:var(--faint);word-break:break-all}
.pwr{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-hi);flex:none;transition:background .25s,box-shadow .25s,color .25s}
.pwr svg{width:22px;height:22px}
.pwr.on{background:var(--c,var(--ice));color:#05070d;border-color:transparent;box-shadow:0 0 26px var(--c,var(--ice))}
.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim);flex:none;align-self:flex-start}
.x:hover{color:var(--text);background:rgba(255,255,255,.06)}
.row{display:flex;align-items:center;gap:10px}
.sect{display:flex;flex-direction:column;gap:8px}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lab b{font-family:var(--f-data);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lab small .on{color:var(--ice);margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--c,var(--ice)) var(--p,50%),rgba(255,255,255,.08) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--c,var(--ice)) var(--p,50%),rgba(255,255,255,.08) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 16px var(--c,var(--ice))}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 16px var(--c,var(--ice))}
input.hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
input.hue::-moz-range-track{background:linear-gradient(90deg,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
input.sat::-webkit-slider-runnable-track{background:linear-gradient(90deg,#fff,var(--hc,#f00))}
input.sat::-moz-range-track{background:linear-gradient(90deg,#fff,var(--hc,#f00))}
input.ct::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ff8a2b,#ffd2a1 30%,#fff6ec 55%,#dfe9ff 80%,#bcd2ff)}
input.ct::-moz-range-track{background:linear-gradient(90deg,#ff8a2b,#ffd2a1 30%,#fff6ec 55%,#dfe9ff 80%,#bcd2ff)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10px;letter-spacing:.06em;color:var(--dim);margin-top:-6px}
.swatch{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 8px currentColor}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;font-size:12px;color:var(--dim)}
.opt[aria-pressed="true"]{border-color:var(--ice);color:var(--text);background:rgba(134,228,255,.1)}
.readouts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.ro{padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.ro small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro b{display:block;font-family:var(--f-data);font-size:14px;margin-top:5px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.feed{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--line)}
.feed canvas,.feed img{width:100%;height:100%;display:block;object-fit:cover}
.feed small{position:absolute;left:10px;top:8px;color:#fff;text-shadow:0 1px 4px #000}
.rec{position:absolute;right:10px;top:8px;font-family:var(--f-data);font-size:10.5px;color:var(--alert);display:flex;gap:6px;align-items:center}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alert);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.media{display:flex;gap:14px;align-items:center}
.disc{width:70px;height:70px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--ice),var(--ion),#ff7ab6,var(--warm),var(--ice));position:relative;animation:spin 6s linear infinite paused;opacity:.55}
.disc::after{content:"";position:absolute;inset:25px;border-radius:50%;background:var(--void);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.disc.play{animation-play-state:running;opacity:1;box-shadow:0 0 30px rgba(181,147,255,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
.disc.art{background:center/cover no-repeat var(--deck);border-radius:12px;animation:none;opacity:1;box-shadow:0 0 24px rgba(134,228,255,.25)}
.disc.art::after{display:none}
.mt{min-width:0}
.mt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt span{color:var(--dim);font-size:12.5px}
.transport{display:flex;justify-content:center;align-items:center;gap:16px}
.tb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.tb:hover{border-color:var(--line-hi)}
.tb.big{width:58px;height:58px;background:var(--ice);color:#05070d;border:0;box-shadow:0 0 24px rgba(134,228,255,.5)}
.clim{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clim .read{text-align:center;min-width:0}
.clim .read b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;margin:6px 0 4px;color:var(--c,var(--ice));text-shadow:0 0 18px var(--c,var(--ice))}
.clim .read span{font-family:var(--f-data);font-size:11px;color:var(--dim)}
.act{padding:11px 14px;border-radius:11px;border:1px solid var(--line-hi);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;text-align:center}
.act:hover{background:rgba(134,228,255,.08)}
.act.danger{border-color:rgba(255,84,112,.5);color:#ffc2cc}
.act.danger.arm{background:var(--alert);color:#fff;border-color:transparent;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 28px var(--alert)}}
.btns{display:flex;flex-direction:column;gap:8px}
.spark{width:100%;height:46px;display:block}
.note{color:var(--dim);font-size:12.5px;line-height:1.55;margin:0}
.note b{color:var(--text);font-weight:600}

/* scene dock */
.dock{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:7px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.scene{display:flex;align-items:center;gap:9px;padding:10px 15px 10px 10px;border-radius:11px;white-space:nowrap;font-size:13px;transition:background .25s,transform .15s}
.scene .g{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--s) 20%,transparent);color:var(--s)}
.scene:hover{background:rgba(255,255,255,.05)}
.scene:active{transform:scale(.96)}
.scene.fire{background:color-mix(in srgb,var(--s) 28%,transparent)}

/* floating overlays */
.lbl{position:fixed;left:0;top:0;z-index:2;pointer-events:none;font-family:var(--f-display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ice);white-space:nowrap;text-shadow:0 0 12px rgba(134,228,255,.8);text-align:center;transition:opacity .4s}
.lbl span{display:block;font-family:var(--f-data);font-size:10px;letter-spacing:.1em;color:var(--dim);margin-top:5px;text-shadow:none}
.lbl.na{color:var(--dim);text-shadow:none}
.tag{position:fixed;left:0;top:0;z-index:6;pointer-events:none;padding:7px 11px;border-radius:9px;font-size:12px;white-space:nowrap}
.tag b{font-weight:600}.tag span{font-family:var(--f-data);color:var(--dim);margin-left:8px;font-size:11px}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);font-family:var(--f-data);font-size:11px;letter-spacing:.06em;color:var(--dim);white-space:nowrap;transition:opacity .8s;pointer-events:none}
.hint.gone{opacity:0}
.toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 84px);padding:11px 16px;font-size:13px;line-height:1.5;max-width:min(520px,calc(100vw - 32px));text-align:center;border-color:var(--line-hi)}
.fatal{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px}
.fatal>div{max-width:540px;padding:24px;display:flex;flex-direction:column;gap:12px}
.fatal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.08em;color:var(--warm)}
.fatal p{margin:0;line-height:1.6;color:var(--dim)}
.fatal code{font-family:var(--f-data);font-size:12px;color:var(--text);background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px;word-break:break-word}

@media (max-width:1240px){.brand small{display:none}.brand{padding-right:14px}}
@media (max-width:1100px){.hide-s{display:none}}
@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px;top:calc(env(safe-area-inset-top,0px) + 10px)}
  .brand{padding:8px 12px 8px 8px}
  .status{margin-left:auto;padding:4px}
  .stat{padding:3px 9px}.stat b{font-size:12.5px}
  .zones{order:3;flex:1 1 100%;margin:0}
  .zone{padding:8px 11px;font-size:12.5px}
  .mode{top:calc(env(safe-area-inset-top,0px) + 118px);padding:6px 10px;font-size:10px}
  .panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-height:46vh}
  .panel.min{max-height:66px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
  .phead{padding:12px 12px 10px 16px;align-items:center}
  .phead h2{font-size:14px}
  .grip{width:38px;height:38px}
  .dock{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:none}
  .scene{padding:8px 12px 8px 8px;font-size:12.5px}
  .hint{display:none}
  .lbl{font-size:9px;letter-spacing:.18em}
  .toast{top:calc(env(safe-area-inset-top,0px) + 118px)}
}
@media (max-width:430px){.brand b{display:none}.brand{padding:8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D view of the home. Drag to orbit, tap a light to switch it, tap anything else to open its controls."></canvas>
<div class="vignette"></div><div class="scan"></div>
<div id="labels"></div>
<header class="top">
  <div class="brand glass"><span class="mark"></span><div><b id="brand">Holo·Home</b><small id="brand-sub">Home Assistant</small></div></div>
  <nav class="zones glass" id="zones" aria-label="Rooms"></nav>
  <div class="status glass" id="status"></div>
</header>
<button class="mode glass" id="mode" type="button"><i></i><span id="mode-t">Demo · simulated states</span></button>
<aside class="panel glass min" id="panel" aria-label="Controls">
  <div class="phead" id="phead">
    <div><small id="p-kicker">All rooms</small><h2 id="p-title">Overview</h2></div>
    <span class="pill" id="p-count"></span>
    <button class="grip" id="grip" type="button" aria-label="Open controls" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="pbody" id="pbody">
    <div id="detail"></div>
    <div class="tiles" id="tiles"></div>
  </div>
</aside>

  const z=UI.zone,Z=ZONES[z]||ZONES.overview;$('#p-title').textContent=Z.name;$('#p-kicker').textContent=Z.kicker||(z==='overview'?'All rooms':'Room');
  const ids=z==='overview'?ALL:ZLIST[z]||[],l=ids.map(i=>E[i]).filter(countable);$('#p-count').textContent=`${l.filter(active).length} / ${l.length} on`;
  setHTML('#detail',detailHTML(UI.sel&&E[UI.sel]));
  setHTML('#tiles',z==='overview'?overviewTiles():(ZLIST[z]||[]).map(i=>tileHTML(E[i])).join(''));
  setHTML('#zones',Object.keys(ZONES).map(k=>{const s=k==='overview'?null:zoneStats(k);return `<button class="zone${s&&s.n&&s.na===s.n?' na':''}" data-zone="${esc(k)}" aria-pressed="${UI.zone===k}">${esc(ZONES[k].name)}${s?`<i>${s.on}</i>`:''}</button>`;}).join(''));
  if(fk){const el=[...document.querySelectorAll('#panel [data-k],#panel [data-act],#panel [data-zone],#zones [data-zone]')].find(n=>fkey(n)===fk);if(el)el.focus({preventScroll:true});}
  live();if(G)G.labels();}
function changed(){render();}
function live(){
  document.querySelectorAll('[data-live]').forEach(el=>{const k=el.dataset.live;el.innerHTML=k==='@power'?sumPower():k==='@weather'?esc(weatherText()):valText(E[k]);});
  const sw=$('#s-weather');if(sw)sw.textContent=weatherText();
  const sp=$('#s-person');if(sp){const p=HOME.people[0];sp.textContent=un(p)?'—':p.state==='home'?'Home':p.state==='not_home'?'Away':cap(p.state);sp.className=p&&p.state==='home'?'ok':'';}
  const spw=$('#s-power');if(spw)spw.textContent=sumPower();
  const cv=document.getElementById('spark');if(cv){const g=cv.getContext('2d'),W=cv.width,H=cv.height,d=HIST[cv.dataset.id]||[];g.clearRect(0,0,W,H);
    g.strokeStyle='rgba(140,220,255,.12)';g.lineWidth=1;for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,H*i/4);g.lineTo(W,H*i/4);g.stroke();}
    if(d.length>1){const mx=Math.max(10,...d)*1.15,x=i=>i/(d.length-1)*(W-8),y=v=>H-4-v/mx*(H-12);
      const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(181,147,255,.45)');gr.addColorStop(1,'rgba(181,147,255,0)');g.beginPath();g.moveTo(0,H);d.forEach((v,i)=>g.lineTo(x(i),y(v)));g.lineTo(x(d.length-1),H);g.fillStyle=gr;g.fill();
      g.beginPath();d.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.strokeStyle='#b593ff';g.lineWidth=3;g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(x(d.length-1),y(d[d.length-1]),6,0,7);g.fill();}}
  const im=document.getElementById('feedimg');if(im&&Date.now()-UI.camT>2000){UI.camT=Date.now();const e=E[UI.sel];if(e&&e.attr&&e.attr.access_token)im.src=`/api/camera_proxy/${e.id}?token=${e.attr.access_token}&t=${UI.camT}`;}}

/* ----- panel: minimised until a room or a device is picked ----- */
function setPanel(open){const p=$('#panel');if(!p.classList.contains('min')===open)return;p.classList.toggle('min',!open);$('#grip').setAttribute('aria-expanded',String(open));$('#grip').setAttribute('aria-label',open?'Minimise controls':'Open controls');setTimeout(()=>G&&G.aim(),UI.phone?60:20);}
const syncPanel=()=>setPanel(UI.zone!=='overview'||!!UI.sel);
function setZone(z){if(!ZONES[z])z='overview';UI.zone=z;if(UI.sel&&z!=='overview'){const e=E[UI.sel];const inZone=(ZLIST[z]||[]).includes(UI.sel)||(e&&e.dev&&e.dev.room.id===z);if(!inZone)UI.sel=null;}if(z==='overview')UI.sel=null;if(G)G.flyTo(z);render();syncPanel();}
function select3D(id){const e=E[id];if(!e)return;UI.sel=id;UI.arm=0;const z=e.dev?e.dev.room.id:e.mp?'media':null;if(UI.zone!=='overview'&&z&&z!==UI.zone){UI.zone=z;if(G)G.flyTo(z);}
  if(TAP(e))A.power(id);else render();syncPanel();}
$('#grip').addEventListener('click',ev=>{ev.stopPropagation();setPanel($('#panel').classList.contains('min'));});
$('#phead').addEventListener('click',()=>{if($('#panel').classList.contains('min'))setPanel(true);});
$('#zones').addEventListener('click',ev=>{const b=ev.target.closest('[data-zone]');if(b)setZone(b.dataset.zone);});
$('#pbody').addEventListener('click',ev=>{const b=ev.target.closest('[data-act],[data-k],[data-zone]');if(!b)return;const d=b.dataset;
  if(d.zone){setZone(d.zone);return;}
  if(d.k){const e=E[d.k];UI.sel=e.id;UI.arm=0;if(TAP(e))A.power(e.id);else render();if(G)G.ping(e.id);return;}
  const e=E[d.id];
  switch(d.act){
    case 'power':A.power(d.id);if(G)G.ping(d.id);break;
    case 'select':A.select(d.id,d.v);break;
    case 'effect':A.effect(d.id,d.v);break;
    case 'press':A.press(d.id);toast(`${b.textContent.trim()} · done`);break;
    case 'media':A.media(d.id,d.v);break;
    case 'temp':A.temp(d.id,+d.v);break;
    case 'hvac':A.hvac(d.id,d.v);break;
    case 'close':UI.sel=null;render();syncPanel();break;
    case 'siren':clearTimeout(UI.armT);
      if(e.state==='on'){UI.arm=0;A.power(d.id);toast('Siren silenced');}
      else if(UI.arm){UI.arm=0;A.power(d.id);if(G)G.ping(d.id);toast('Siren sounding · tap Silence to stop');}
      else{UI.arm=1;render();UI.armT=setTimeout(()=>{UI.arm=0;render();},3500);}
      break;}});
$('#pbody').addEventListener('input',ev=>{const r=ev.target;if(r.type!=='range')return;UI.busy=true;const v=+r.value,a=r.dataset.act,e=E[r.dataset.id],sec=r.closest('.sect'),lb=sec.querySelector('.lab b'),det=r.closest('.detail');
  if(a==='bri'||a==='vol'||a==='fan'){r.style.setProperty('--p',v+'%');if(lb)lb.textContent=v+'%';if(a==='bri'){e.bri=v;if(!HA.live)e.state='on';}else if(a==='vol')e.vol=v/100;else e.pct=v;return;}
  if(a==='hue'||a==='sat'){const h=+sec.querySelector('.hue').value,s=+sec.querySelector('.sat').value;setHS(e,h,s);if(e.dev)e.dev.override=true;sec.querySelector('.sat').style.setProperty('--hc',`hsl(${h} 100% 50%)`);if(lb)lb.innerHTML=`<span class="swatch" style="color:${css(e.rgb)};background:${css(e.rgb)}"></span>${hex(e.rgb)}`;}
  else if(a==='ct'){setCT(e,v);if(lb)lb.textContent=v+' K';}
  if(!HA.live)e.state='on';if(det)det.style.setProperty('--c',css(e.rgb));});
$('#pbody').addEventListener('change',ev=>{const r=ev.target;if(r.type!=='range')return;UI.busy=false;const v=+r.value,a=r.dataset.act,id=r.dataset.id,sec=r.closest('.sect');
  if(a==='bri')A.bri(id,v);else if(a==='vol')A.media(id,'vol',v/100);else if(a==='fan')A.fan(id,v);else if(a==='ct')A.ct(id,v);else A.hs(id,+sec.querySelector('.hue').value,+sec.querySelector('.sat').value);if(G)G.ping(id);if(UI.pending)render();});
$('#dock').addEventListener('click',ev=>{const b=ev.target.closest('[data-scene]');if(!b)return;const s=SCENES[+b.dataset.scene];A.scene(s);b.classList.add('fire');setTimeout(()=>b.classList.remove('fire'),700);toast(`${s.name} is on`);});
addEventListener('keydown',ev=>{if(ev.target.closest&&ev.target.closest('input'))return;const keys=Object.keys(ZONES);
  if(/^[1-9]$/.test(ev.key)&&keys[+ev.key-1])setZone(keys[+ev.key-1]);else if(ev.key==='Escape'){if(UI.sel){UI.sel=null;render();syncPanel();}else if(UI.zone!=='overview')setZone('overview');}});

/* ----- boot ----- */
function fatal(h,p){$('#fatal-h').textContent=h;$('#fatal-p').innerHTML=p;$('#fatal').hidden=false;$('#gl').hidden=true;['.top','#mode','#panel','#dock','#hint'].forEach(s=>{const n=$(s);if(n)n.hidden=true;});}
const need=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s);});
let CFGERR='';addEventListener('error',ev=>{if(/config\.js/.test(ev.filename||''))CFGERR=`${ev.message} (config.js line ${ev.lineno})`;});
async function boot(){
  if(!window.THREE)await need('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
  if(!window.HOLO){const ok=await need('config.js?v='+Date.now());
    if(!window.HOLO){fatal('config.js has a problem',ok?`Your browser stopped reading <code>config.js</code> at: <code>${esc(CFGERR||'unknown error')}</code>. Usually it's a missing comma, quote or bracket just before that line. Paste the file back into Claude with that message and ask it to fix it.`:`<code>config.js</code> wasn't found next to this page. Put your <code>config.js</code> in the same folder as <code>index.html</code> (for example <code>/config/www/holo-home/</code>).`);return;}}
  try{normalise(window.HOLO);}catch(err){fatal('config.js has a problem',`It loaded, but this part couldn't be read: <code>${esc(err.message)}</code>.`);return;}
  if(!ROOMS.length){fatal('No rooms yet','<code>config.js</code> loaded but has no <code>rooms</code>. Add at least one room with its devices.');return;}
  $('#brand').textContent=HOME.title;$('#brand-sub').textContent=HOME.subtitle;document.title=HOME.title.replace('·',' ');
  ZONES={overview:{name:'Overview',kicker:'All rooms'}};ROOMS.forEach(R=>{ZONES[R.id]={name:R.name,kicker:R.sub};ZLIST[R.id]=R.devs.map(D=>D.id);});
  if(MEDIA.length){ZONES.media={name:'Media',kicker:'Players'};ZLIST.media=MEDIA.map(m=>m.id);}
  ALL=DEV.map(D=>D.id).concat(MEDIA.map(m=>m.id).filter(id=>!E[id].dev));
  const st=[`<div class="stat"><small>Time</small><b id="s-clock">--:--</b></div>`];
  if(HOME.weather)st.push(`<div class="stat"><small>Outside</small><b id="s-weather">—</b></div>`);
  if(HOME.people[0])st.push(`<div class="stat"><small>${esc(HOME.people[0].name)}</small><b id="s-person">—</b></div>`);
  if(HOME.power.length)st.push(`<div class="stat hide-s"><small>Power</small><b id="s-power">—</b></div>`);
  $('#status').innerHTML=st.join('');
  if(SCENES.length)$('#dock').innerHTML=SCENES.map((s,i)=>`<button class="scene" data-scene="${i}" style="--s:${esc(s.color)}"><span class="g">${ic(s.icon)}</span>${esc(s.name)}</button>`).join('');else $('#dock').hidden=true;
  HA.init();if(!HA.live)demoInit();
  worldLayout();
  try{if(window.THREE)G=buildScene();}catch(err){G=null;console.warn('Holo Home: 3D unavailable',err);}
  if(!G)$('#gl').hidden=true;
  const m=$('#mode');if(HA.live){m.classList.add('live');$('#mode-t').textContent='Live · Home Assistant';}else if(!G)$('#mode-t').textContent='Demo · 3D unavailable here';
  m.addEventListener('click',()=>toast(HA.live?'Connected to Home Assistant. Every control here drives your real devices.':'Running on demo states. Open this page from a Home Assistant dashboard to control your real devices.',6500));
  render();
  const clock=()=>{const c=$('#s-clock');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};clock();setInterval(clock,10000);
  setInterval(demoTick,1500);setInterval(live,700);
  if(G){G.start();addEventListener('resize',()=>G.resize());}
  setTimeout(()=>$('#hint').classList.add('gone'),9000);
}
boot();
</script>
